name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply config
        run: node ../scripts/apply-config.mjs
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
