<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dgmos — Extension token</title>
    <style>
      :root {
        --bg: #f4f7fa;
        --card: #fff;
        --ink: #0b3a5b;
        --accent: #1f7a8c;
        --muted: #5b6b7a;
        --border: #d7e0e8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #e8f1f6, var(--bg));
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(480px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 12px 40px rgba(11, 58, 91, 0.08);
      }
      h1 { margin: 0 0 8px; font-size: 1.35rem; }
      p { margin: 0 0 16px; color: var(--muted); font-size: 0.92rem; line-height: 1.45; }
      label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; }
      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 12px;
        font: inherit;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px;
        background: var(--ink);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: var(--accent); }
      pre {
        margin-top: 16px;
        background: #0b3a5b;
        color: #e8f6ff;
        border-radius: 10px;
        padding: 12px;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 0.8rem;
        min-height: 3rem;
      }
      .err { color: #b42318; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Dgmos LinkedIn token</h1>
      <p>Admin key ile bir kerelik <code>dgext_</code> token üret. Extension popup’a yapıştır.</p>
      <label for="api">API URL</label>
      <input id="api" value="http://localhost:8088" />
      <label for="key">Admin key (X-Admin-Key)</label>
      <input id="key" type="password" value="change-me-admin-key" />
      <button id="go" type="button">Token oluştur</button>
      <pre id="out">—</pre>
    </main>
    <script>
      const out = document.getElementById("out");
      document.getElementById("go").addEventListener("click", async () => {
        out.className = "";
        out.textContent = "…";
        const api = document.getElementById("api").value.replace(/\/$/, "");
        const key = document.getElementById("key").value;
        try {
          const res = await fetch(api + "/admin/bootstrap-token", {
            method: "POST",
            headers: { "X-Admin-Key": key }
          });
          const body = await res.json();
          if (!res.ok) throw new Error(body.error || res.statusText);
          out.textContent = body.secret + "\n\n" + (body.hint || "");
        } catch (err) {
          out.className = "err";
          out.textContent = err instanceof Error ? err.message : String(err);
        }
      });
    </script>
  </body>
</html>
