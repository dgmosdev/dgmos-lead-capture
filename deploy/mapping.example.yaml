# Host tablolarına eşle. Bu süreç tablo yaratmaz.
# Kullanılmayan tablo: table: "-"
# Kullanılmayan kolon: phone: ""

auth:
  mode: token_table # token_table | header | jwt
  header:
    user_id: X-User-Id
    customer_id: X-Customer-Id
  jwt:
    secret_env: JWT_SECRET
    user_claim: user_id
    customer_claim: customer_id

leads:
  table: leads
  columns:
    id: id
    create_user_id: create_user_id
    create_customer_id: create_customer_id
    name: name
    profile_url: profile_url
    linkedin_url: linkedin_url
    title: title
    company: company
    location: location
    email: email
    phone: phone
    website: website
    headline: headline
    about: about
    enrich_status: enrich_status
    ai_status: ai_status
    metadata: metadata
    created_at: created_at
    updated_at: updated_at
    deleted_at: deleted_at

tokens:
  table: extension_tokens
  columns:
    id: id
    token_hash: token_hash
    label: label
    created_at: created_at
    create_user_id: create_user_id
    create_customer_id: create_customer_id

workspaces:
  table: "-"
