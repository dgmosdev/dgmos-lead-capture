# Dgmos compose.yml → services altına yapıştır.
# Bu repoyu sunucuya klonlama. Image + env yeter.
# Kolonlar default mapping ile aynıysa MAPPING_FILE gerekmez.

  lead-capture:
    image: ghcr.io/dgmosdev/lead-capture:1.3.0
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4&collation=utf8mb4_turkish_ci
      SCHEMA_CHECK: "true"
      AUTO_MIGRATE: "true"
      ADMIN_KEY: ${LEAD_CAPTURE_ADMIN_KEY}
      TOKEN_PREFIX: dgext_
      CORS_ORIGIN: "*"
      ENV: production
      HTTP_ADDR: ":8088"
      DISPLAY_NAME: Dgmos
    # Nginx varsa ports kaldır, sadece expose bırak.
    ports:
      - "8088:8088"
    expose:
      - "8088"
