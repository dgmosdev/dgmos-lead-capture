openapi: 3.0.3
info:
  title: LinkedIn Import Host API
  version: 1.3.0
  description: >
    Host Contract for the LinkedIn Import Chrome extension sidecar.
servers:
  - url: http://localhost:8088
paths:
  /v1/health:
    get:
      summary: Health check with DB ping
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          $ref: "#/components/responses/Error"
  /healthz:
    get:
      summary: Alias for /v1/health
      operationId: healthz
      responses:
        "200":
          description: OK
  /v1/session:
    get:
      summary: Validate extension token
      operationId: session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
  /v1/leads:
    get:
      summary: List saved leads
      operationId: listLeads
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: enrich_status
          in: query
          schema: { type: string, enum: [listed, enriched] }
        - name: ai_status
          in: query
          schema: { type: string, enum: [none, pending, done, skipped] }
        - name: q
          in: query
          schema: { type: string }
        - name: sort
          in: query
          description: Use oldest for background enrich FIFO queue
          schema: { type: string, enum: [oldest] }
      responses:
        "200":
          description: Lead page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadList"
        "401":
          $ref: "#/components/responses/Error"
    post:
      summary: Upsert leads
      operationId: importLeads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/leads/{id}:
    patch:
      summary: Update lead enrich/AI status
      operationId: patchLeadStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: BIGINT id as decimal string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enrich_status: { type: string, enum: [listed, enriched] }
                ai_status: { type: string, enum: [none, pending, done, skipped] }
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/Error"
  /v1/tokens:
    get:
      summary: List tokens
      security:
        - adminKey: []
      responses:
        "200":
          description: Token list
    post:
      summary: Create token
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [create_user_id, create_customer_id]
              properties:
                label: { type: string }
                create_user_id:
                  oneOf:
                    - { type: integer }
                    - { type: string }
                  description: Host BIGINT user id
                create_customer_id:
                  oneOf:
                    - { type: integer }
                    - { type: string }
                  description: Host BIGINT customer id
      responses:
        "200":
          description: Created token + secret
        "400":
          $ref: "#/components/responses/Error"
  /v1/tokens/{id}:
    delete:
      summary: Revoke token
      security:
        - adminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: BIGINT id as decimal string
      responses:
        "204":
          description: Deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
  schemas:
    Session:
      type: object
      required: [workspace_id, workspace_name, providers]
      properties:
        workspace_id:
          type: string
          description: create_customer_id as decimal string
          example: "42"
        workspace_name:
          type: string
        providers:
          type: array
          items:
            type: string
          example: [linkedin]
        features:
          type: object
          description: Optional capability flags for the extension
          properties:
            ai:
              type: boolean
            ai_provider:
              type: string
              nullable: true
            enrich:
              type: boolean
              description: Optional pin; omit to defer to extension skipEnrichWithoutAi
    Lead:
      type: object
      properties:
        name:
          type: string
        profile_url:
          type: string
          format: uri
        linkedin_url:
          type: string
          format: uri
        title:
          type: string
        company:
          type: string
        location:
          type: string
        email:
          type: string
        phone:
          type: string
        website:
          type: string
        headline:
          type: string
        about:
          type: string
        enrich_status:
          type: string
          enum: [listed, enriched]
        ai_status:
          type: string
          enum: [none, pending, done, skipped]
    LeadListItem:
      allOf:
        - $ref: "#/components/schemas/Lead"
        - type: object
          required: [id, name, profile_url, enrich_status, ai_status]
          properties:
            id: { type: string, description: BIGINT id as decimal string, example: "1" }
            updated_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
    LeadList:
      type: object
      required: [items, totals]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LeadListItem"
        next_cursor:
          type: string
        totals:
          type: object
          properties:
            all: { type: integer }
            listed: { type: integer }
            enriched: { type: integer }
            ai_none: { type: integer }
            ai_pending: { type: integer }
            ai_done: { type: integer }
            ai_skipped: { type: integer }
    ImportRequest:
      type: object
      required: [leads]
      properties:
        provider:
          type: string
          default: linkedin
        page_url:
          type: string
        leads:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Lead"
    ImportResult:
      type: object
      properties:
        created:
          type: integer
        merged:
          type: integer
        skipped:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
