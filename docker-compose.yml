services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dgmos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dgmos}
      POSTGRES_DB: ${POSTGRES_DB:-dgmos_leads}
    ports:
      - "5433:5432"
    volumes:
      - dgmos_pg:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dgmos} -d ${POSTGRES_DB:-dgmos_leads}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  db-mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_USER: ${MYSQL_USER:-dgmos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dgmos}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dgmos_leads}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dgmos}
    ports:
      - "3307:3306"
    volumes:
      - dgmos_mysql:/var/lib/mysql
      - ./sql/schema.mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-dgmos}", "-p${MYSQL_PASSWORD:-dgmos}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://dgmos:dgmos@db:5432/dgmos_leads?sslmode=disable}
      HTTP_ADDR: ${HTTP_ADDR:-:8088}
      ADMIN_KEY: ${ADMIN_KEY:-change-me-admin-key}
      WORKSPACE_ID: ${WORKSPACE_ID:-11111111-1111-1111-1111-111111111111}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Dgmos}
      TOKEN_PREFIX: ${TOKEN_PREFIX:-dgext_}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ENV: ${ENV:-development}
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dgmos_pg:
  dgmos_mysql:
