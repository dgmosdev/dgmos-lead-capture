services:
  linkedin-import:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: linkedin-import-api:1.2.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MAPPING_FILE: /config/mapping.yaml
      SCHEMA_CHECK: ${SCHEMA_CHECK:-true}
      ADMIN_KEY: ${ADMIN_KEY}
      TOKEN_PREFIX: ${TOKEN_PREFIX:-dgext_}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ENV: ${ENV:-production}
      HTTP_ADDR: ${HTTP_ADDR:-:8088}
    volumes:
      - ${MAPPING_FILE:-./deploy/mapping.example.yaml}:/config/mapping.yaml:ro
    ports:
      - "8088:8088"
